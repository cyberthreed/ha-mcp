name: scratch-unit
on:
  push:
    branches: [scratch/image-entity-core-tests]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch https://github.com/homeassistant-ai/ha-mcp.git master:upmaster
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.14 --all-extras --dev
      - run: uv run pytest tests/src/unit/test_tools_camera_image_entities.py tests/src/unit/test_tools_camera.py tests/src/unit/test_core_reply_rules.py tests/src/unit/test_stand_in_lists_ratchet.py -q
      - run: uv run python scripts/duplicate_code_ratchet.py --base $(git merge-base HEAD upmaster)
      - run: uv run ruff check tests/src/unit && uv run ruff format --check tests/src/unit
